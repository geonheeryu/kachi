spring:
  application:
    name: ai-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mongodb:
    representation:
      uuid: standard
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

kachi:
  ai:
    scheduler:
      keyword-expansion:
        enabled: false
        fixed-delay: 24h
        initial-delay: 5m
        max-expansions-per-keyword: 5
      story-summary:
        enabled: true
        fixed-delay: 5m
        initial-delay: 1m
        max-stories-per-tick: 20
    story-summary:
      min-new-articles: 3
      max-wait: 60m
      max-articles-per-version: 50
    consumer:
      group-id: ai-service
      auto-offset-reset: earliest
      concurrency: 1
      # 즉시 트리거의 LLM 호출이 poll 처리 시간에 들어가므로 한 poll을 작게 잡는다.
      max-poll-records: 10
      topics:
        story-article-attached: story.article.attached
        story-merged: story.merged
      dlt:
        topic: ai.story.dlt
      retry:
        initial-backoff: 1s
        max-backoff: 30s
        multiplier: 2.0
    story-quarantine:
      failure-threshold: 3
    outbox:
      relay:
        enabled: true
        publisher-id: ${HOSTNAME:ai-service-${random.uuid}}
        fixed-delay: 5s
        initial-delay: 15s
        batch-size: 50
        publishing-visibility-timeout: 60s
        retry:
          max-attempts: 5
          base-delay: 1s
          max-delay: 1m
          multiplier: 2.0
    events:
      enabled: true
      topics:
        summary-created: ai.summary.created
        story-split-requested: ai.story.split-requested
        story-quarantined: ai.story.quarantined
    clients:
      user-service:
        base-url: ${KACHI_USER_SERVICE_BASE_URL:}
        active-keywords-path: /api/v1/internal/keywords/active
        timeout: 3s
        max-in-memory-size: 262144
    llm:
      providers:
        GROQ:
          base-url: https://api.groq.com/openai/v1
          api-key: ${GROQ_API_KEY:}
          billing: free-tier
          connect-timeout: 2s
        MISTRAL:
          base-url: https://api.mistral.ai/v1
          api-key: ${MISTRAL_API_KEY:}
          billing: free-tier
          connect-timeout: 2s
        # 같은 머신의 Ollama.
        OLLAMA:
          base-url: http://localhost:11434/v1
          billing: self-hosted
          connect-timeout: 2s
      # slow-after는 timeout보다 짧아야 한다.
      models:
        GROQ_QWEN3_27B: { timeout: 10s, slow-after: 8s }
        MISTRAL_SMALL_2603: { timeout: 10s, slow-after: 8s }
        OLLAMA_QWEN3_27B: { timeout: 150s, slow-after: 120s }
      # 용도마다 시도할 모델의 순서. 여기 없는 모델은 클라이언트도 서킷도 만들지 않는다.
      uses:
        STORY_SUMMARY:
          candidates: [GROQ_QWEN3_27B, MISTRAL_SMALL_2603]
        KEYWORD_EXPANSION:
          candidates: [GROQ_QWEN3_27B, MISTRAL_SMALL_2603]
      guard:
        # failure rate·slow call rate·wait duration은 모델 전체가 공유한다. slow call duration threshold는 models.*.slow-after다.
        circuit-breaker:
          sliding-window-size: 6
          minimum-number-of-calls: 3
          failure-rate-threshold: 50
          slow-call-rate-threshold: 80
          wait-duration-in-open-state: 60s
          permitted-number-of-calls-in-half-open-state: 2
        # 429를 받은 모델이 대기 시간. Retry-After가 있으면 그 값(상한 max), 없으면 default.
        cooldown:
          default: 60s
          max: 10m
        # 404·401·402·403을 받은 모델이나 제공자를 후보에서 빼는 시간. 지나면 한 번 다시 시도하고 같은 실패면 다시 뺀다.
        hold:
          reprobe-after: 1h
